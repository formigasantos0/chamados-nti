name: Deploy Chamados NTI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: chamados-nti-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout da aplicação
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: cloudlabhost/chamados-nti-backend:${{ github.sha }}

      - name: Build e push do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: cloudlabhost/chamados-nti-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=/api

      - name: Checkout do repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: formigasantos0/kubernetes-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: kubernetes-infra

      - name: Atualizar imagens no GitOps
        working-directory: kubernetes-infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "/repository: cloudlabhost\/chamados-nti-backend/{n;s/tag: .*/tag: ${IMAGE_TAG}/;}" \
            platform/charts/ntu-app/values/chamados-nti-backend.yaml

          sed -i "/repository: cloudlabhost\/chamados-nti-frontend/{n;s/tag: .*/tag: ${IMAGE_TAG}/;}" \
            platform/charts/ntu-app/values/chamados-nti-frontend.yaml

      - name: Commit e push do GitOps
        working-directory: kubernetes-infra
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            platform/charts/ntu-app/values/chamados-nti-backend.yaml \
            platform/charts/ntu-app/values/chamados-nti-frontend.yaml

          git diff --cached --quiet && exit 0

          git commit -m "deploy: chamados-nti ${IMAGE_TAG}"
          git push